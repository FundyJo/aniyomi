name: Desktop Windows

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - 'docs/multiplatform/FEATURE_PARITY.md'
  push:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-windows:
    name: Desktop Windows compile
    runs-on: windows-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Build source API
        shell: bash
        run: ./gradlew :source-api:build

      - name: Run domain tests
        shell: bash
        run: ./gradlew :domain:allTests

      - name: Build data module
        shell: bash
        run: ./gradlew :data:build

      - name: Compile desktop app
        shell: bash
        run: ./gradlew :app-desktop:compileKotlinDesktop
